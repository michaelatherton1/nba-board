name: Daily NBA board

on:
  schedule:
    # GitHub cron is UTC (CT = UTC-6 in winter, UTC-5 in summer).
    - cron: "37 12 * * *"   # 6:37 AM CT: earliest prices (opening-line forward test)
    - cron: "23 15 * * *"   # 9:23 AM CT: morning board
    - cron: "47 22 * * *"   # 4:47 PM CT: afternoon injury reports + lines
    - cron: "41 0 * * *"    # 6:41 PM CT: final reports before the late tips
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore cached history seasons
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nba-raw-${{ github.run_id }}
          restore-keys: nba-raw-

      - name: Unit tests
        run: |
          PYTHONPATH=. python tests/test_venues.py
          python tests/test_injuries_live.py

      - name: Build today's board
        run: python -m nbadash.run

      - name: Refresh tables for the Excel workbook's Update button
        continue-on-error: true
        run: python -m nbadash.workbook_feed --out site/wb

      - name: Keep raw API samples for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit the day's snapshot (used to grade projections tomorrow)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history site/wb
          if ! git diff --cached --quiet; then
            git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
